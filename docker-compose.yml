services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agis_work}
      POSTGRES_USER: ${POSTGRES_USER:-agis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agis-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agis} -d ${POSTGRES_DB:-agis_work}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agis}:${POSTGRES_PASSWORD:-agis-local}@db:5432/${POSTGRES_DB:-agis_work}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      SEED_DATA: ${SEED_DATA:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
